{{ define "main" }}
<main>
  <article>
    <header>
      <h1>{{ .Title }}</h1>
    </header>
    {{ .Content }}
  </article>
  <ul>
    {{ range .Pages -}}
      <li><a href="{{ .RelPermalink }}">{{ .Date.Format "2006-01-02" }} | {{ .LinkTitle }}</a></li>
    {{ end -}}
  </ul>
  <p class="text-center">
    <a href="{{ "/tags/" | absURL }}">View all tags →</a>
  </p>
</main>
{{ end }}
